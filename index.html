<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-visual">
<title>Викторина</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Nunito:wght@400;600;700&display=swap');

:root {
  --gold: #f5c842;
  --dark: #0d0d14;
  --surface: #16161f;
  --surface2: #1e1e2d;
  --accent: #7c5cfc;
  --accent2: #fc5c9c;
  --text: #f0eeff;
  --text-muted: #9090b0;
  --correct: #43d483;
  --wrong: #fc5c5c;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--dark); color: var(--text); font-family: 'Nunito', sans-serif; }

/* ══ LOADING ══ */
#loading-screen {
  position: fixed; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  background: var(--dark); z-index: 1000; gap: 18px;
}
#loading-screen::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(ellipse 80% 60% at 50% 0%, #2a1a6e44, transparent),
              radial-gradient(ellipse 60% 50% at 80% 100%, #6a1a4444, transparent);
  pointer-events: none;
}
.ld-logo {
  font-family: 'Unbounded', sans-serif;
  font-size: clamp(1.8rem, 5vw, 3.5rem); font-weight: 900; letter-spacing: -2px;
  background: linear-gradient(135deg, var(--gold) 0%, var(--accent2) 60%, var(--accent) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text; text-align: center; position: relative; z-index: 1;
}
.ld-subtitle {
  font-family: 'Unbounded', sans-serif;
  font-size: clamp(0.75rem, 2vw, 1rem); font-weight: 400;
  color: var(--text-muted); text-align: center;
  position: relative; z-index: 1; margin-top: -8px; min-height: 1.3em;
  letter-spacing: 1px;
}
.ld-bar-wrap {
  width: 280px; height: 4px; background: #ffffff15;
  border-radius: 99px; overflow: hidden; position: relative; z-index: 1;
}
.ld-bar {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  border-radius: 99px; transition: width 0.4s ease;
}
.ld-status { font-size: 0.85rem; color: var(--text-muted); position: relative; z-index: 1; text-align: center; }

/* ══ ERROR ══ */
#error-screen {
  display: none; position: fixed; inset: 0;
  flex-direction: column; align-items: center; justify-content: center;
  background: var(--dark); z-index: 999; gap: 18px; padding: 20px;
}
.err-icon { font-size: 4rem; }
.err-title { font-family: 'Unbounded', sans-serif; font-size: 1.4rem; font-weight: 900; color: var(--wrong); }
.err-msg { font-size: 0.9rem; color: var(--text-muted); max-width: 480px; text-align: center; line-height: 1.7; }
.err-msg code { font-family: monospace; background: #ffffff10; padding: 2px 6px; border-radius: 4px; color: var(--gold); }

/* ══ QUIZ ══ */
#quiz-screen { display: none; width: 100%; min-height: 100vh; flex-direction: column; align-items: center; }

.quiz-header {
  width: 100%; max-width: 1200px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 24px; position: sticky; top: 0; z-index: 200;
  background: linear-gradient(to bottom, var(--dark) 65%, transparent);
}
.hdr-left { display: flex; align-items: center; gap: 14px; min-width: 0; flex: 1; }
.quiz-title {
  font-family: 'Unbounded', sans-serif; font-size: 0.85rem; font-weight: 700;
  color: var(--gold); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  max-width: 280px; flex-shrink: 0;
}
.prog-wrap { flex: 1; min-width: 80px; max-width: 260px; height: 5px; background: #ffffff15; border-radius: 99px; overflow: hidden; }
.prog-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 99px; transition: width 0.5s ease; }
.hdr-right { display: flex; align-items: center; gap: 18px; flex-shrink: 0; }
.page-counter { font-family: 'Unbounded', sans-serif; font-size: 0.72rem; color: var(--text-muted); white-space: nowrap; }
.timer { font-family: 'Unbounded', sans-serif; font-size: 1rem; font-weight: 700; color: var(--gold); min-width: 64px; text-align: right; }

.quiz-body { width: 100%; max-width: 1200px; padding: 0 20px 32px; display: flex; flex-direction: column; gap: 20px; }

.image-stage {
  position: relative; width: 100%; border-radius: 18px; overflow: hidden;
  box-shadow: 0 20px 60px #00000090; background: #080810;
}
.image-stage img { width: 100%; display: block; border-radius: 18px; }

/* ── Answer widgets ── */
.answer-widget {
  position: absolute; z-index: 50; display: flex; flex-direction: column;
  /* font-size is set via JS proportional to image scale — all em units scale with it */
  font-size: 16px; /* fallback, overridden per widget */
  gap: 0.3em;
}

/* Choices: vertical (default) or horizontal */
.w-choices { display: flex; gap: 0.35em; }
.w-choices.vertical   { flex-direction: column; }
.w-choices.horizontal { flex-direction: row; flex-wrap: nowrap; align-items: flex-start; width: max-content; }

.w-choice {
  background: rgba(18, 16, 36, 0.93);
  backdrop-filter: blur(10px);
  border: 1.5px solid rgba(124,92,252,0.45);
  border-radius: 0.55em; padding: 0.38em 0.7em;
  color: var(--text); font-family: 'Nunito', sans-serif;
  font-size: 1em; font-weight: 900;
  cursor: pointer; transition: border-color 0.18s, background 0.18s, opacity 0.18s;
  white-space: nowrap; text-align: left;
  display: flex; align-items: center; gap: 0.4em;
}
.w-choice:hover:not(.locked) { border-color: var(--accent); background: rgba(124,92,252,0.22); }
.w-choice.correct     { border-color: var(--correct); background: rgba(67,212,131,0.22); }
.w-choice.wrong       { border-color: var(--wrong);   background: rgba(252,92,92,0.22); }
.w-choice.locked      { cursor: default; }
.w-choice.dim         { opacity: 0.35; }

/* Icons inside choice buttons */
.w-icon { flex-shrink: 0; width: 1.1em; height: 1.1em; display: block; }

/* Text input */
.w-text-wrap { display: flex; align-items: center; gap: 0.4em; width: max-content; max-width: 100%; }
.w-text-input {
  flex: 1;
  background: rgba(18, 16, 36, 0.93); backdrop-filter: blur(10px);
  border: 1.5px solid rgba(124,92,252,0.45); border-radius: 0.55em;
  padding: 0.4em 0.8em; color: var(--text); font-family: 'Nunito', sans-serif;
  font-size: 1em; font-weight: 900;
  outline: none; transition: border-color 0.18s; min-width: 0;
}
.w-text-input:focus   { border-color: var(--accent); }
.w-text-input.correct { border-color: var(--correct); color: var(--correct); }
.w-text-input.wrong   { border-color: var(--wrong);   color: var(--wrong); }
.w-text-input:disabled { opacity: 0.85; cursor: default; }

/* comment/answer bubble */
.w-comment {
  display: inline-block;
  background: rgba(10, 8, 28, 0.92); backdrop-filter: blur(12px);
  border: 1.5px solid rgba(255,255,255,0.18);
  border-radius: 0.5em; padding: 0.25em 0.65em;
  font-family: 'Nunito', sans-serif; font-size: 1em; font-weight: 900;
  color: #f0eeff; line-height: 1.3;
  box-shadow: 0 2px 12px rgba(0,0,0,0.6);
  white-space: nowrap; flex-shrink: 0;
}

/* ── Nav ── */
.nav-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
.score-live { font-family: 'Unbounded', sans-serif; font-size: 0.78rem; color: var(--text-muted); }
.score-live b { color: var(--gold); }
.btn-next {
  font-family: 'Unbounded', sans-serif; font-size: 0.82rem; font-weight: 700;
  letter-spacing: 1px; text-transform: uppercase;
  padding: 14px 32px; border: none; border-radius: 12px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #fff; cursor: pointer; transition: all 0.25s;
  box-shadow: 0 6px 24px #7c5cfc44; display: flex; align-items: center; gap: 10px;
}
.btn-next:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 12px 32px #7c5cfc66; }
.btn-next:disabled { opacity: 0.3; cursor: not-allowed; transform: none; box-shadow: none; }

/* ══ RESULT ══ */
#result-screen {
  display: none; width: 100%; min-height: 100vh;
  flex-direction: column; align-items: center; justify-content: center;
  padding: 40px 20px; position: relative;
}
#result-screen::before {
  content: ''; position: fixed; inset: 0;
  background: radial-gradient(ellipse 80% 60% at 50% 20%, #1a6e2a44, transparent),
              radial-gradient(ellipse 60% 50% at 20% 80%, #6e1a6a44, transparent);
  pointer-events: none;
}
.result-card {
  background: var(--surface); border: 1px solid #ffffff12; border-radius: 28px;
  padding: 48px 40px; width: 100%; max-width: 520px;
  display: flex; flex-direction: column; align-items: center; gap: 26px;
  box-shadow: 0 40px 80px #00000060; position: relative; z-index: 1; text-align: center;
}
.r-trophy { font-size: 5rem; animation: bounce 1s ease infinite alternate; }
@keyframes bounce { from{transform:translateY(0) rotate(-5deg)} to{transform:translateY(-12px) rotate(5deg)} }
.r-congrats {
  font-family: 'Unbounded', sans-serif; font-size: clamp(1.3rem,4vw,2rem); font-weight: 900;
  background: linear-gradient(135deg, var(--gold), var(--accent2));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; line-height: 1.2;
}
.r-msg { font-size: 0.95rem; color: var(--text-muted); line-height: 1.6; max-width: 360px; }
.r-stats { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stat-box { background: var(--surface2); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 5px; }
.stat-val { font-family: 'Unbounded', sans-serif; font-size: 1.9rem; font-weight: 900; }
.stat-val.g { color: var(--gold); } .stat-val.a { color: var(--accent); }
.stat-lbl { font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
.acc-wrap { width: 100%; }
.acc-track { width:100%; height:8px; background:#ffffff10; border-radius:99px; overflow:hidden; margin-top:8px; }
.acc-fill  { height:100%; border-radius:99px; background:linear-gradient(90deg,var(--accent),var(--correct)); transition:width 1.2s ease; }
.acc-row   { display:flex; justify-content:space-between; font-size:0.75rem; color:var(--text-muted); margin-top:5px; }
.btn-restart {
  font-family:'Unbounded',sans-serif; font-size:0.82rem; font-weight:700;
  letter-spacing:1px; text-transform:uppercase; padding:14px 32px; border:none; border-radius:12px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff; cursor:pointer; transition:all 0.25s; box-shadow:0 6px 24px #7c5cfc44;
}
.btn-restart:hover { transform:translateY(-2px); box-shadow:0 12px 32px #7c5cfc66; }

/* Confetti */
.cp { position:fixed; pointer-events:none; z-index:9999; border-radius:2px; animation:cf linear forwards; }
@keyframes cf { 0%{transform:translateY(-20px) rotate(0)} 100%{transform:translateY(110vh) rotate(720deg);opacity:0} }

::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-thumb { background: #ffffff20; border-radius: 3px; }
/* ══ MENU ══ */
#menu-screen {
  display: none; position: fixed; inset: 0;
  flex-direction: column; align-items: center; justify-content: center;
  background: var(--dark); z-index: 900; gap: 28px; padding: 24px;
}
#menu-screen::before {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse 80% 60% at 50% 0%, #2a1a6e44, transparent),
              radial-gradient(ellipse 60% 50% at 80% 100%, #6a1a4444, transparent);
}
.menu-logo {
  font-family: 'Unbounded', sans-serif;
  font-size: clamp(1.6rem, 5vw, 3rem); font-weight: 900; letter-spacing: -2px;
  background: linear-gradient(135deg, var(--gold) 0%, var(--accent2) 60%, var(--accent) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text; text-align: center; position: relative; z-index: 1;
}
.menu-subtitle {
  font-family: 'Unbounded', sans-serif; font-size: clamp(0.7rem, 2vw, 0.9rem);
  color: var(--text-muted); text-align: center; letter-spacing: 1px;
  position: relative; z-index: 1; margin-top: -18px;
}
.menu-card {
  background: var(--surface); border: 1px solid #ffffff12;
  border-radius: 20px; padding: 32px 28px;
  width: 100%; max-width: 420px;
  display: flex; flex-direction: column; gap: 14px;
  position: relative; z-index: 1;
  box-shadow: 0 32px 64px #00000060;
}
.menu-mode-btn {
  font-family: 'Unbounded', sans-serif; font-size: 0.82rem; font-weight: 700;
  letter-spacing: 0.5px; padding: 18px 20px; border: none; border-radius: 14px;
  cursor: pointer; transition: all 0.22s; text-align: left;
  display: flex; flex-direction: column; gap: 5px;
}
.menu-mode-btn .mb-title { font-size: 0.9rem; }
.menu-mode-btn .mb-sub   { font-size: 0.72rem; font-weight: 400; opacity: 0.75; font-family: 'Nunito', sans-serif; }
.menu-mode-full {
  background: linear-gradient(135deg, var(--accent), #5a3fd4);
  color: #fff; box-shadow: 0 6px 24px #7c5cfc44;
}
.menu-mode-full:hover  { transform: translateY(-2px); box-shadow: 0 12px 32px #7c5cfc66; }
.menu-mode-rand {
  background: linear-gradient(135deg, var(--accent2), #c0306a);
  color: #fff; box-shadow: 0 6px 24px #fc5c9c44;
}
.menu-mode-rand:hover  { transform: translateY(-2px); box-shadow: 0 12px 32px #fc5c9c66; }

/* timer paused indicator */
.timer.paused { color: var(--text-muted); }

/* share button */
.btn-share {
  font-family: 'Unbounded', sans-serif; font-size: 0.82rem; font-weight: 700;
  letter-spacing: 1px; text-transform: uppercase;
  padding: 14px 32px; border: none; border-radius: 12px;
  background: var(--surface2); border: 1px solid #ffffff18;
  color: var(--text); cursor: pointer; transition: all 0.25s; width: 100%;
  display: flex; align-items: center; justify-content: center; gap: 10px;
}
.btn-share:hover { border-color: var(--accent); color: var(--accent); }
.btn-share.copied { border-color: var(--correct); color: var(--correct); }



/* ── static label overlays ── */
.page-label {
  position: absolute; z-index: 48;
  background: rgba(18, 16, 36, 0.93);
  backdrop-filter: blur(10px);
  border: 1.5px solid rgba(124,92,252,0.45);
  border-radius: 0.55em; padding: 0.38em 0.7em;
  font-family: 'Nunito', sans-serif;
  font-size: 16px; /* overridden per element via JS */
  font-weight: 900;
  color: #f0eeff; line-height: 1.4;
  white-space: pre-wrap; word-break: break-word;
  box-sizing: border-box;
}
</style>
</head>
<body>


<!-- ══ MENU ══ -->
<div id="menu-screen">
  <div class="menu-logo" id="menu-logo">ВИКТОРИНА</div>
  <div class="menu-subtitle" id="menu-subtitle"></div>
  <div class="menu-card">
    <button class="menu-mode-btn menu-mode-full" onclick="startMode('full')">
      <span class="mb-title">📚 Полная игра</span>
      <span class="mb-sub" id="mb-full-sub">Все карточки по порядку</span>
    </button>
    <button class="menu-mode-btn menu-mode-rand" onclick="startMode('random')">
      <span class="mb-title">🎲 Случайный набор</span>
      <span class="mb-sub" id="mb-rand-sub">20 случайных карточек</span>
    </button>
  </div>
</div>

<!-- ══ LOADING ══ -->
<div id="loading-screen">
  <div class="ld-logo">ВИКТОРИНА</div>
  <div class="ld-subtitle" id="ld-subtitle"></div>
  <div class="ld-bar-wrap"><div class="ld-bar" id="ld-bar"></div></div>
  <div class="ld-status" id="ld-status">Загрузка…</div>
</div>

<!-- ══ ERROR ══ -->
<div id="error-screen">
  <div class="err-icon">⚠️</div>
  <div class="err-title">Не удалось загрузить</div>
  <div class="err-msg" id="err-msg"></div>
</div>

<!-- ══ QUIZ ══ -->
<div id="quiz-screen">
  <div class="quiz-header">
    <div class="hdr-left">
      <div class="quiz-title" id="quiz-title">ВИКТОРИНА</div>
      <div class="prog-wrap"><div class="prog-fill" id="prog-fill"></div></div>
    </div>
    <div class="hdr-right">
      <div class="page-counter" id="page-counter">1 / 1</div>
      <div class="timer" id="timer">00:00</div>
    </div>
  </div>
  <div class="quiz-body">
    <div class="image-stage" id="image-stage">
      <img id="quiz-img" src="" alt="">
    </div>
    <div class="nav-row">
      <div class="score-live" id="score-live">Очки: <b>0</b></div>
      <button class="btn-next" id="btn-next" disabled onclick="nextPage()">
        Следующая страница <span>→</span>
      </button>
    </div>
  </div>
</div>

<!-- ══ RESULT ══ -->
<div id="result-screen">
  <div class="result-card">
    <div class="r-trophy" id="r-trophy">🏆</div>
    <div class="r-congrats" id="r-congrats">Поздравляем!</div>
    <div class="r-msg" id="r-msg"></div>
    <div class="r-stats">
      <div class="stat-box"><div class="stat-val g" id="r-score">0</div><div class="stat-lbl">Правильных</div></div>
      <div class="stat-box"><div class="stat-val a" id="r-time">00:00</div><div class="stat-lbl">Времени</div></div>
    </div>
    <div class="acc-wrap">
      <div style="font-size:.82rem;color:var(--text-muted)">Точность</div>
      <div class="acc-track"><div class="acc-fill" id="acc-fill" style="width:0%"></div></div>
      <div class="acc-row"><span id="acc-pct">0%</span><span id="acc-tot"></span></div>
    </div>
    <button class="btn-share" id="btn-share" onclick="shareResult()">📤 Поделиться результатом</button>
    <button class="btn-restart" onclick="location.reload()">↺ Начать заново</button>
  </div>
</div>

<script>
// ─────────────────────────────────────────────
//  SVG icon factory (inline, no external deps)
// ─────────────────────────────────────────────
const NS = 'http://www.w3.org/2000/svg';

function svgCheck(size) {
  const s = document.createElementNS(NS, 'svg');
  s.setAttribute('viewBox', '0 0 24 24');
  s.style.cssText = `width:${size};height:${size};flex-shrink:0;display:block;`;
  // circle
  const c = document.createElementNS(NS, 'circle');
  c.setAttribute('cx','12'); c.setAttribute('cy','12'); c.setAttribute('r','11');
  c.setAttribute('fill','#43d483');
  // polyline
  const p = document.createElementNS(NS, 'polyline');
  p.setAttribute('points','5,12 10,17 19,7');
  p.setAttribute('stroke','#fff'); p.setAttribute('stroke-width','2.8');
  p.setAttribute('fill','none'); p.setAttribute('stroke-linecap','round');
  p.setAttribute('stroke-linejoin','round');
  s.appendChild(c); s.appendChild(p);
  return s;
}

function svgCross(size) {
  const s = document.createElementNS(NS, 'svg');
  s.setAttribute('viewBox', '0 0 24 24');
  s.style.cssText = `width:${size};height:${size};flex-shrink:0;display:block;`;
  const c = document.createElementNS(NS, 'circle');
  c.setAttribute('cx','12'); c.setAttribute('cy','12'); c.setAttribute('r','11');
  c.setAttribute('fill','#fc5c5c');
  function line(x1,y1,x2,y2) {
    const l = document.createElementNS(NS, 'line');
    l.setAttribute('x1',x1); l.setAttribute('y1',y1);
    l.setAttribute('x2',x2); l.setAttribute('y2',y2);
    l.setAttribute('stroke','#fff'); l.setAttribute('stroke-width','2.8');
    l.setAttribute('stroke-linecap','round');
    return l;
  }
  s.appendChild(c); s.appendChild(line(7,7,17,17)); s.appendChild(line(17,7,7,17));
  return s;
}

// ─────────────────────────────────────────────
//  STATE
// ─────────────────────────────────────────────
const LAYOUT_FILE = 'layout.json';

const S = {
  title: 'ВИКТОРИНА',
  showAnswers: true,
  startPage: 0,
  startPageQuiz: 0,    // first page index that is part of the quiz (pages before are informational)
  randomCount: 20,
  mode: 'full',
  allPages: [],
  pages: [],
  inIntro: false,      // true while showing intro pages before menu
  timerPaused: false,
  cur: 0,
  score: 0,
  totalQ: 0,
  timerSec: 0,
  timerInt: null,
  answered: [],
  correct: [],
};

// ─────────────────────────────────────────────
//  BOOT
// ─────────────────────────────────────────────
async function boot() {
  setStatus('Загрузка layout.json…', 0);

  let layout;
  try {
    const r = await fetch(LAYOUT_FILE);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    layout = await r.json();
  } catch(e) {
    return showError(
      `Не удалось загрузить <code>${LAYOUT_FILE}</code>.<br><br>` +
      `Страница должна быть открыта через веб-сервер.<br>` +
      `<b>Быстрый старт:</b> <code>python3 -m http.server 8080</code>`
    );
  }

  // Accept:  plain array  OR  { title, pages: [...] }
  let pages;
  if (Array.isArray(layout)) {
    pages = layout;
  } else if (layout && Array.isArray(layout.pages)) {
    pages = layout.pages;
    if (layout.title) {
      S.title = layout.title;
      document.getElementById('ld-subtitle').textContent = layout.title;
      document.title = layout.title;
    }
    if (layout.showAnswers === false) S.showAnswers = false;
    if (typeof layout.startPage === 'number') S.startPage = layout.startPage;
    if (typeof layout.randomCount === 'number') S.randomCount = layout.randomCount;
    if (typeof layout.startPageQuiz === 'number') S.startPageQuiz = layout.startPageQuiz;
  } else {
    return showError(`<code>${LAYOUT_FILE}</code>: неверный формат.`);
  }

  if (!pages.length) return showError('Список страниц пуст.');

  // Store all pages; resolve paths without loading anything yet
  S.allPages = pages.map(p => ({ ...p, resolvedSrc: `images/${p.image}`, imgLoaded: false }));

  // Quiz pages = everything from startPageQuiz onward
  const quizPages = S.allPages.slice(S.startPageQuiz);
  const rCount = Math.min(S.randomCount, quizPages.length);
  document.getElementById('menu-logo').textContent = S.title;
  document.getElementById('mb-full-sub').textContent =
    `${quizPages.length} карточек`;
  document.getElementById('mb-rand-sub').textContent =
    `${rCount} случайных карточек из ${quizPages.length}`;
  if (quizPages.length <= S.randomCount)
    document.querySelector('.menu-mode-rand').style.display = 'none';

  setStatus('Готово!', 100);
  await sleep(150);
  document.getElementById('loading-screen').style.display = 'none';

  if (S.startPageQuiz > 0) {
    // Show intro pages first, then menu after last intro page
    S.inIntro = true;
    S.pages = S.allPages.slice(0, S.startPageQuiz); // intro pages only
    S.totalQ = 0; // no scoring during intro
    S.cur = 0;
    // Preload first intro image
    document.getElementById('loading-screen').style.display = 'flex';
    setStatus('Загрузка…', 50);
    try {
      await preloadImg(S.pages[0].resolvedSrc);
      S.pages[0].imgLoaded = true;
    } catch { /* non-fatal */ }
    setStatus('Готово!', 100);
    await sleep(150);
    document.getElementById('loading-screen').style.display = 'none';
    document.getElementById('quiz-screen').style.display = 'flex';
    document.getElementById('quiz-title').textContent = S.title;
    renderPage();
    bgPreload(1);
  } else {
    document.getElementById('menu-screen').style.display = 'flex';
  }
}

// ─────────────────────────────────────────────
//  MENU: start game in chosen mode
// ─────────────────────────────────────────────
function startMode(mode) {
  S.mode = mode;
  S.score = 0; S.timerSec = 0;

  // Reset imgLoaded on all pages
  S.allPages.forEach(p => { p.imgLoaded = false; });

  // Only quiz pages participate in both modes (intro pages excluded)
  const quizPool = S.allPages.slice(S.startPageQuiz);

  if (mode === 'random') {
    // Fisher-Yates shuffle, take first randomCount
    const arr = [...quizPool];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    S.pages = arr.slice(0, Math.min(S.randomCount, arr.length));
  } else {
    // Full game: all quiz pages
    S.pages = quizPool.slice();
  }

  S.totalQ = S.pages.reduce((s,p) => s + (p.questions||[]).length, 0);
  S.cur = 0;

  document.getElementById('menu-screen').style.display = 'none';

  // Show loading for first image
  document.getElementById('loading-screen').style.display = 'flex';
  setStatus('Загрузка первой картинки…', 50);

  preloadImg(S.pages[0].resolvedSrc)
    .then(() => {
      S.pages[0].imgLoaded = true;
      setStatus('Готово!', 100);
      return sleep(150);
    })
    .then(() => {
      document.getElementById('loading-screen').style.display = 'none';
      document.getElementById('quiz-screen').style.display = 'flex';
      document.getElementById('quiz-title').textContent = S.title;
      startTimer();
      renderPage();
      bgPreload(1);
    })
    .catch(() => showError('Не удалось загрузить первую картинку.'));
}

function preloadImg(src) {
  return new Promise((res, rej) => { const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=src; });
}
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
function setStatus(msg, pct) {
  document.getElementById('ld-status').textContent = msg;
  document.getElementById('ld-bar').style.width = pct + '%';
}
function showError(html) {
  document.getElementById('loading-screen').style.display = 'none';
  document.getElementById('error-screen').style.display = 'flex';
  document.getElementById('err-msg').innerHTML = html;
}

// ─────────────────────────────────────────────
//  TIMER
// ─────────────────────────────────────────────
function startTimer() {
  clearInterval(S.timerInt);
  S.timerPaused = false;
  document.getElementById('timer').classList.remove('paused');
  S.timerInt = setInterval(() => {
    if (!S.timerPaused) {
      S.timerSec++;
      document.getElementById('timer').textContent = fmt(S.timerSec);
    }
  }, 1000);
}
function pauseTimer() {
  S.timerPaused = true;
  document.getElementById('timer').classList.add('paused');
}
function resumeTimer() {
  S.timerPaused = false;
  document.getElementById('timer').classList.remove('paused');
}
function fmt(s) {
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  const mm = String(m).padStart(2,'0');
  const ss = String(sec).padStart(2,'0');
  return h > 0
    ? `${String(h).padStart(2,'0')}:${mm}:${ss}`
    : `${mm}:${ss}`;
}

// ─────────────────────────────────────────────
//  RENDER PAGE
// ─────────────────────────────────────────────
function renderPage() {
  const page  = S.pages[S.cur];
  const total = S.pages.length;

  if (S.inIntro) {
    document.getElementById('prog-fill').style.width = '0%';
    document.getElementById('page-counter').textContent = '';
    document.getElementById('score-live').style.visibility = 'hidden';
    document.getElementById('timer').style.visibility = 'hidden';
  } else {
    document.getElementById('prog-fill').style.width = `${(S.cur/total)*100}%`;
    document.getElementById('page-counter').textContent = `${S.cur+1} / ${total}`;
    document.getElementById('score-live').style.visibility = 'visible';
    document.getElementById('timer').style.visibility = 'visible';
  }

  const stage = document.getElementById('image-stage');
  const imgEl = document.getElementById('quiz-img');
  stage.querySelectorAll('.answer-widget, .page-label').forEach(el => el.remove());
  // If this image wasn't preloaded yet, load it now (on-demand)
  if (!page.imgLoaded) {
    preloadImg(page.resolvedSrc)
      .then(() => { page.imgLoaded = true; })
      .catch(() => {});
  }
  imgEl.src = page.resolvedSrc;

  function calcScale() {
    const natW = imgEl.naturalWidth  || 1200;
    const natH = imgEl.naturalHeight || 900;
    const dW   = imgEl.offsetWidth;
    const dH   = imgEl.offsetHeight || (dW * natH / natW);
    const fontScale = (S.pages[S.cur] && S.pages[S.cur].fontScale) ? S.pages[S.cur].fontScale : 0.0164;
    return {
      sx: dW / natW,
      sy: dH / natH,
      baseFontPx: Math.max(8, fontScale * dW)
    };
  }

  // placeWidgets — called ONCE per page: builds DOM widgets and inits state
  function placeWidgets() {
    S.answered = new Array(page.questions.length).fill(false);
    S.correct  = new Array(page.questions.length).fill(false);

    const { sx, sy, baseFontPx } = calcScale();

    page.questions.forEach((q, qi) => {
      const widget = document.createElement('div');
      widget.className = 'answer-widget';
      widget.dataset.qi  = qi;
      widget.dataset.qx  = q.x;
      widget.dataset.qy  = q.y;
      widget.dataset.qw  = q.width || 280;
      widget.dataset.dir = (q.type === 'choice' && q.direction === 'horizontal') ? 'h' : 'v';
      widget.style.left     = (q.x * sx) + 'px';
      widget.style.top      = (q.y * sy) + 'px';
      widget.style.fontSize = baseFontPx + 'px';
      if (widget.dataset.dir === 'h') {
        widget.style.width    = 'max-content';
        widget.style.maxWidth = ((imgEl.naturalWidth - q.x) * sx) + 'px';
      } else {
        widget.style.width    = ((q.width || 280) * sx) + 'px';
        widget.style.maxWidth = '';
      }

      if (q.type === 'choice') buildChoice(widget, q, qi);
      else                     buildText(widget, q, qi);

      stage.appendChild(widget);
    });

    (page.labels || []).forEach((lb, li) => {
      const el = document.createElement('div');
      el.className = 'page-label';
      el.dataset.lx = lb.x;
      el.dataset.ly = lb.y;
      el.dataset.lw = lb.width || 200;
      el.textContent    = lb.text || '';
      el.style.left     = (lb.x * sx) + 'px';
      el.style.top      = (lb.y * sy) + 'px';
      el.style.width    = ((lb.width || 200) * sx) + 'px';
      el.style.fontSize = baseFontPx + 'px';
      if (lb.color)      el.style.color      = lb.color;
      if (lb.background) el.style.background = lb.background;
      if (lb.borderColor) el.style.borderColor = lb.borderColor;
      stage.appendChild(el);
    });

    updateNav();
    updateScore();
  }

  // repositionWidgets — called on resize: only updates position/size/font, never touches state or DOM structure
  function repositionWidgets() {
    const { sx, sy, baseFontPx } = calcScale();

    const natW = imgEl.naturalWidth || 1200;
    stage.querySelectorAll('.answer-widget').forEach(w => {
      w.style.left     = (parseFloat(w.dataset.qx) * sx) + 'px';
      w.style.top      = (parseFloat(w.dataset.qy) * sy) + 'px';
      w.style.fontSize = baseFontPx + 'px';
      if (w.dataset.dir === 'h') {
        w.style.maxWidth = ((natW - parseFloat(w.dataset.qx)) * sx) + 'px';
      } else {
        w.style.width  = (parseFloat(w.dataset.qw) * sx) + 'px';
      }
    });

    stage.querySelectorAll('.page-label').forEach(el => {
      el.style.left     = (parseFloat(el.dataset.lx) * sx) + 'px';
      el.style.top      = (parseFloat(el.dataset.ly) * sy) + 'px';
      el.style.width    = (parseFloat(el.dataset.lw) * sx) + 'px';
      el.style.fontSize = baseFontPx + 'px';
    });
  }

  imgEl.complete && imgEl.naturalWidth ? placeWidgets() : (imgEl.onload = placeWidgets);

  // ── Resize handler: only reposition, never rebuild ──
  // On mobile, showing/hiding the keyboard fires resize — we must ignore those.
  // We detect "real" resize by checking if the image width actually changed.
  let _lastImgW = imgEl.offsetWidth;
  if (window._rzH) window.removeEventListener('resize', window._rzH);
  let _rzTimer = null;
  window._rzH = () => {
    clearTimeout(_rzTimer);
    _rzTimer = setTimeout(() => {
      const newW = imgEl.offsetWidth;
      if (newW === _lastImgW) return;  // keyboard or scroll — skip
      _lastImgW = newW;
      repositionWidgets();
    }, 150);
  };
  window.addEventListener('resize', window._rzH);
}

// ─────────────────────────────────────────────
//  BUILD: choice widget
//  q.direction = "vertical" (default) | "horizontal"
// ─────────────────────────────────────────────
function buildChoice(widget, q, qi) {
  const dir = q.direction === 'horizontal' ? 'horizontal' : 'vertical';
  const grid = document.createElement('div');
  grid.className = `w-choices ${dir}`;

  (q.options || []).forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'w-choice';

    const span = document.createElement('span');
    span.textContent = opt;
    btn.appendChild(span);

    btn.onclick = () => onChoice(qi, opt, btn, q.answer, q.comment, grid, widget);
    grid.appendChild(btn);
  });

  widget.appendChild(grid);
}

// ─────────────────────────────────────────────
//  BUILD: text widget
//  q.answer = string  OR  array of strings (all accepted, case-insensitive)
// ─────────────────────────────────────────────
function buildText(widget, q, qi) {
  const wrap = document.createElement('div');
  wrap.className = 'w-text-wrap';

  const inp = document.createElement('input');
  inp.className = 'w-text-input';
  inp.type = 'text';
  inp.placeholder = '…';

  // iconSlot: holds the SVG icon + optional answer/comment bubble, all in one row
  const iconSlot = document.createElement('span');
  iconSlot.style.cssText = 'display:flex;align-items:center;gap:6px;flex-shrink:0;white-space:nowrap;';

  const submit = () => {
    if (!S.answered[qi] && inp.value.trim()) onText(qi, inp, q.answer, q.comment, iconSlot);
  };
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
  inp.addEventListener('blur', submit);

  wrap.appendChild(inp);
  wrap.appendChild(iconSlot);
  widget.appendChild(wrap);
}

// ─────────────────────────────────────────────
//  ANSWER HANDLERS
// ─────────────────────────────────────────────
function onChoice(qi, val, btn, correct, comment, grid, widget) {
  if (S.answered[qi]) return;
  S.answered[qi] = true;
  const isOk = val === correct;

  grid.querySelectorAll('.w-choice').forEach(b => {
    const bText = b.querySelector('span').textContent;
    b.classList.add('locked');

    if (b === btn) {
      b.classList.add(isOk ? 'correct' : 'wrong');
      b.appendChild(isOk ? svgCheck('1.1em') : svgCross('1.1em'));
    } else if (bText === correct && !isOk && S.showAnswers) {
      // Reveal correct answer only if showAnswers is on
      b.classList.add('correct');
      b.appendChild(svgCheck('1.1em'));
    } else {
      b.classList.add('dim');
    }
  });

  if (isOk) { S.correct[qi] = true; S.score++; }

  // Comment bubble inside the correct button, after the check icon — only on correct answer
  if (comment && isOk) {
    const correctBtn = [...grid.querySelectorAll('.w-choice')]
      .find(b => b.querySelector('span').textContent === correct);
    if (correctBtn) {
      const cb = document.createElement('span');
      cb.className = 'w-comment';
      cb.textContent = comment;
      correctBtn.appendChild(cb);
    }
  }

  updateNav(); updateScore();
}

function onText(qi, inp, correctRaw, comment, iconSlot) {
  if (S.answered[qi] || !inp.value.trim()) return;
  S.answered[qi] = true;
  inp.disabled = true;

  const allCorrect = Array.isArray(correctRaw)
    ? correctRaw.map(String)
    : [String(correctRaw)];
  const variants = allCorrect.map(v => v.toLowerCase().trim());
  const isOk = variants.includes(inp.value.trim().toLowerCase());

  inp.classList.add(isOk ? 'correct' : 'wrong');

  // Icon always goes first into iconSlot (right of input)
  iconSlot.appendChild(isOk ? svgCheck('1.7em') : svgCross('1.7em'));

  // After the icon: correct answers or comment, all in the same row
  if (!isOk && S.showAnswers) {
    // Wrong: show correct answers comma-separated, no comment
    const cb = document.createElement('span');
    cb.className = 'w-comment';
    cb.textContent = allCorrect.join(', ');
    iconSlot.appendChild(cb);
  } else if (isOk && comment) {
    // Correct + comment: show comment bubble
    const cb = document.createElement('span');
    cb.className = 'w-comment';
    cb.textContent = comment;
    iconSlot.appendChild(cb);
  }

  if (isOk) { S.correct[qi] = true; S.score++; }
  updateNav(); updateScore();
}

// ─────────────────────────────────────────────
//  NAVIGATION
// ─────────────────────────────────────────────
function updateNav() {
  const noQuestions = S.answered.length === 0;
  const allDone = noQuestions || S.answered.every(v => v);
  const btn = document.getElementById('btn-next');
  btn.disabled = !allDone;
  if (S.inIntro) {
    btn.innerHTML = S.cur === S.pages.length - 1
      ? 'Начать викторину ▶'
      : 'Далее <span>→</span>';
    btn.disabled = false; // intro pages are always passable
  } else {
    btn.innerHTML = (allDone && S.cur === S.pages.length - 1)
      ? 'Завершить викторину 🏁'
      : 'Следующая страница <span>→</span>';
  }
  // Pause timer on pages with no questions or during intro
  if (S.inIntro || noQuestions || allDone) pauseTimer(); else resumeTimer();
}

function updateScore() {
  document.getElementById('score-live').innerHTML = `Очки: <b>${S.score}</b>`;
}

function nextPage() {
  if (S.inIntro) {
    if (S.cur < S.pages.length - 1) {
      // More intro pages to show
      S.cur++;
      renderPage();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      const ahead = S.cur + 1;
      if (ahead < S.pages.length && !S.pages[ahead].imgLoaded) {
        preloadImg(S.pages[ahead].resolvedSrc)
          .then(() => { S.pages[ahead].imgLoaded = true; }).catch(() => {});
      }
    } else {
      // Last intro page done → show mode menu
      S.inIntro = false;
      document.getElementById('quiz-screen').style.display = 'none';
      document.getElementById('menu-screen').style.display = 'flex';
    }
    return;
  }
  if (S.cur < S.pages.length - 1) {
    S.cur++;
    renderPage();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    const ahead = S.cur + 1;
    if (ahead < S.pages.length && !S.pages[ahead].imgLoaded) {
      preloadImg(S.pages[ahead].resolvedSrc)
        .then(() => { S.pages[ahead].imgLoaded = true; })
        .catch(() => {});
    }
  } else {
    endQuiz();
  }
}

// ─────────────────────────────────────────────
//  RESULT
// ─────────────────────────────────────────────
function endQuiz() {
  clearInterval(S.timerInt);
  document.getElementById('quiz-screen').style.display = 'none';
  document.getElementById('result-screen').style.display = 'flex';

  const total = S.totalQ, score = S.score;
  const pct  = Math.round((score/total)*100);
  const time = fmt(S.timerSec);

  document.getElementById('r-score').textContent = `${score}/${total}`;
  document.getElementById('r-time').textContent = time;
  document.getElementById('acc-pct').textContent = `${pct}%`;
  document.getElementById('acc-tot').textContent = `${score} из ${total}`;
  setTimeout(() => document.getElementById('acc-fill').style.width = `${pct}%`, 200);

  let trophy, congrats, msg;
  if      (pct===100) { trophy='🏆'; congrats='Идеальный результат!'; msg=`Все ${total} вопросов верно! Время: ${time}.`; }
  else if (pct>=80)   { trophy='🥇'; congrats='Отличный результат!';  msg=`${score} из ${total}. Великолепно! Время: ${time}.`; }
  else if (pct>=60)   { trophy='🥈'; congrats='Хороший результат!';   msg=`${score} из ${total}. Достойно! Время: ${time}.`; }
  else if (pct>=40)   { trophy='🥉'; congrats='Неплохо!';             msg=`${score} из ${total}. Есть куда расти. Время: ${time}.`; }
  else                { trophy='📚'; congrats='Попробуйте ещё раз!';  msg=`${score} из ${total}. Изучите тему и попробуйте снова!`; }

  document.getElementById('r-trophy').textContent = trophy;
  document.getElementById('r-congrats').textContent = congrats;
  document.getElementById('r-msg').textContent = msg;

  if (pct >= 60) confetti(pct >= 80 ? 80 : 40);
}

// ─────────────────────────────────────────────
//  UTILS
// ─────────────────────────────────────────────
// ─────────────────────────────────────────────
//  SHARE RESULT
// ─────────────────────────────────────────────
function shareResult() {
  const total = S.totalQ, score = S.score;
  const pct   = Math.round((score / total) * 100);
  const time  = fmt(S.timerSec);
  const mode  = S.mode === 'random' ? '🎲 Случайный набор' : '📚 Полная игра';
  const stars = pct === 100 ? '🏆' : pct >= 80 ? '🥇' : pct >= 60 ? '🥈' : pct >= 40 ? '🥉' : '📚';
  const bar   = '█'.repeat(Math.round(pct / 10)) + '░'.repeat(10 - Math.round(pct / 10));

  const text =
    `${stars} ${S.title}
` +
    `${mode}
` +
    `
` +
    `Результат: ${score}/${total} (${pct}%)
` +
    `${bar}
` +
    `Время: ${time}
` +
    `
` +
    `Попробуй сам! 👉 ${location.href}`;

  const btn = document.getElementById('btn-share');

  // Use Web Share API if available (mobile), fallback to clipboard
  if (navigator.share) {
    navigator.share({
      title: S.title,
      text: text,
      url: location.href
    }).catch(() => {});
  } else {
    navigator.clipboard.writeText(text).then(() => {
      btn.textContent = '✓ Скопировано в буфер';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.innerHTML = '📤 Поделиться результатом';
        btn.classList.remove('copied');
      }, 2500);
    }).catch(() => {
      // Fallback: show text in prompt
      prompt('Скопируйте результат:', text);
    });
  }
}

function confetti(n) {
  const cols = ['#f5c842','#7c5cfc','#fc5c9c','#43d483','#fc5c5c','#5cc8fc'];
  for (let i=0; i<n; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'cp';
      el.style.cssText = `left:${Math.random()*100}vw;top:-20px;
        background:${cols[Math.floor(Math.random()*cols.length)]};
        width:${6+Math.random()*10}px;height:${6+Math.random()*10}px;
        border-radius:${Math.random()>.5?'50%':'2px'};
        animation-duration:${2+Math.random()*3}s;`;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 5000);
    }, i*30);
  }
}


// ─────────────────────────────────────────────
//  BACKGROUND PRELOAD
//  Loads pages sequentially starting from idx,
//  yielding after each so UI stays responsive.
// ─────────────────────────────────────────────
async function bgPreload(startIdx) {
  for (let i = startIdx; i < S.pages.length; i++) {
    if (S.pages[i].imgLoaded) continue;
    try {
      await preloadImg(S.pages[i].resolvedSrc);
      S.pages[i].imgLoaded = true;
    } catch {
      // Non-fatal: will retry when page is actually shown
    }
    // Yield to browser between each image
    await sleep(0);
  }
}

boot();
</script>
